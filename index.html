<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>ToDo</title>
  </head>
  <body>
    <header>
      <img src="images/logo.png" alt="logo" />
      <div class="header-center">
        <h1>ToDo</h1>
      </div>
    </header>
    <main>
      <div class="input-section">
        <input
          type="text"
          id="task_input"
          placeholder="Введите название дела"
        />
        <button id="addButton">Добавить</button>
      </div>
      <div class="filter-section">
        <button class="filter-btn active" data-filter="all">Все</button>
        <button class="filter-btn" data-filter="active">Активные</button>
        <button class="filter-btn" data-filter="completed">Выполненные</button>
      </div>
      <div class="columns-container">
        <div class="column" data-tag="университет">
          <h2>Университет</h2>
          <div class="task-column" id="university-tasks"></div>
        </div>

        <div class="column" data-tag="дом">
          <h2>Дом</h2>
          <div class="task-column" id="home-tasks"></div>
        </div>

        <div class="column" data-tag="работа">
          <h2>Работа</h2>
          <div class="task-column" id="work-tasks"></div>
        </div>
      </div>
      <div id="tasksContainer" class="tasks-container">
        <div class="empty-state">Список дел пуст. Добавьте первую задачу!</div>
        <ul id="taskList" class="task-list"></ul>
      </div>
    </main>
    <footer>
      <h1>2252 Денисова Ксения</h1>
    </footer>
  </body>
  <script src="code.js"></script>
</html>
